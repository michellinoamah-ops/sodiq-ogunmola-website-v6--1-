<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in. Sodiq Ogunmola</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="shortcut icon" href="../assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 200 200" aria-hidden="true" style="width:42px;height:42px;"><polygon points="46,16 154,16 154,124 100,188 46,124" fill="#2E1245"/><polygon points="46,16 154,16 154,124 100,188 46,124" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/><line x1="72" y1="52" x2="128" y2="52" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/><line x1="72" y1="70" x2="128" y2="70" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/><line x1="72" y1="88" x2="118" y2="88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/><polyline points="66,112 88,132 138,78" fill="none" stroke="#2454C7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Admin sign in</h1>
    <p class="lede">Manage enquiries, comments, and publications for the research repository.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-accent btn-block">Sign in</button>
      <div id="login-status" class="form-status" role="alert"></div>
    </form>
    <p class="form-note center" style="margin-top:20px; text-align:center;"><a href="../index.html" style="color:var(--accent); font-weight:600; font-family: var(--mono); font-size: 0.82rem;">&larr; Back to the public site</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/admin.js"></script>
<script>initLoginPage();</script>
</body>
</html>
